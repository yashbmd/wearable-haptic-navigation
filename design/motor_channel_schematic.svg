<text x="103" y="380" font-family="Arial" font-size="20" fill="#235f5e">D3 / D5 / D6</text>
<rect x="376" y="320" rx="12" width="146" height="53" fill="#f7e4d4" stroke="#de844f" stroke-width="2"/>
<text x="411" y="353" font-family="Arial" font-size="24" fill="#703a23">220 Ω</text>
<path d="M287 348 H376 M522 348 H715 V476 H822" fill="none" stroke="#0b817d" stroke-width="5"/>
<text x="584" y="320" font-family="Arial" font-size="18" fill="#0b817d">gate control</text>
