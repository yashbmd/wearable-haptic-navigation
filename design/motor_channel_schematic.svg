<text x="62" y="66" font-family="Arial" font-size="29" font-weight="bold" fill="#15333a">UNO R4 → one protected ERM motor channel (repeat three times)</text>
<text x="62" y="111" font-family="Arial" font-size="17" fill="#587078">Signal pins: D3, D5, D6. Supply GND must be common. This is a concept wiring diagram, not EDA-signed manufacturing schematic.</text>
